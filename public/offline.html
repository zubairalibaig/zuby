<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Zuby</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; padding: 24px; color: #262626; background: #fafafa;
      }
      .card { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #737373; line-height: 1.6; margin: 0 0 1.5rem; }
      a { display: inline-block; background: #e8590c; color: #fff; text-decoration: none;
          padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Zuby needs a connection to show you who's cooking nearby. Chef menus,
        timings and availability change through the day, so we don't show you a
        saved copy that might be wrong.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
